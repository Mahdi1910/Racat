<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>عداد الركعات المطور</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
</head>
<body>

    <div id="app-container">
        <!-- 9:16 Aspect Ratio Camera Container -->
        <div id="canvas-wrapper">
            <video id="video" playsinline muted></video>
            <canvas id="output"></canvas>

            <!-- Floating Start Button on the Left Side of Video -->
            <div class="start-btn-container">
                <button id="startBtn" class="btn-primary" onclick="startApp()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <span>ابدأ الصلاة الآن</span>
                </button>
            </div>

            <!-- UI Overlay Floating on Top of Camera -->
            <div class="overlay-layer">
                <!-- Top Row: Counter & Status -->
                <div class="top-bar">
                    <div class="counter-badge">
                        <span class="counter-label-text">الركعة الحالية</span>
                        <span id="counter-display" class="counter-number">1</span>
                    </div>

                    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
                        <div class="status-pill">
                            <span id="status-dot" class="status-dot"></span>
                            <span id="status">بانتظار التشغيل...</span>
                        </div>
                        <button id="resetBtn" class="reset-btn" onclick="resetApp()">إعادة الضبط</button>
                    </div>
                </div>

                <!-- Bottom Row: Status Guidance -->
                <div class="bottom-bar">
                    <div id="sub-status" class="sub-status-text">اضغط على زر البدء لتشغيل الكاميرا والعد الآلي</div>
                    <div class="guide-text">تأكد من إظهار الجسم بالكامل في الكاميرا (9:16)</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
